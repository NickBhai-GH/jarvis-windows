<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --ink: #16181d; --muted: #616772; --rule: #d9dce1; --rule-strong: #16181d;
  --hl: #fff1bf; --hl-ink: #4a3500; --bad: #b3261e; --good: #1d6b3a; --active: #1f4fd1;
  --meter: #16181d; --btn: #16181d; --btn-ink: #ffffff; --row: #f4f5f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --ink: #e8e9eb; --muted: #9aa0a9; --rule: #2d3036; --rule-strong: #e8e9eb;
    --hl: #3d3210; --hl-ink: #ffe9a3; --bad: #ff8a80; --good: #7fd49b; --active: #8fb0ff;
    --meter: #e8e9eb; --btn: #e8e9eb; --btn-ink: #111316; --row: #1a1d21;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --ink: #e8e9eb; --muted: #9aa0a9; --rule: #2d3036; --rule-strong: #e8e9eb;
  --hl: #3d3210; --hl-ink: #ffe9a3; --bad: #ff8a80; --good: #7fd49b; --active: #8fb0ff;
  --meter: #e8e9eb; --btn: #e8e9eb; --btn-ink: #111316; --row: #1a1d21;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 "Public Sans", system-ui, sans-serif; padding: 20px 28px 60px; max-width: 1500px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 800; margin: 0; }
h2 { font-size: 17px; font-weight: 700; margin: 0 0 8px; padding-top: 14px; border-top: 2px solid var(--rule-strong); }
section { margin-bottom: 30px; }
a { color: inherit; }
code { font-size: 13px; word-break: break-all; }
.muted { color: var(--muted); }
.bad { color: var(--bad); }
.good { color: var(--good); }
.num { font-variant-numeric: tabular-nums; }

header { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: end;
  padding-bottom: 14px; border-bottom: 1px solid var(--rule); margin-bottom: 22px; }
#status { font-size: 28px; font-weight: 800; text-align: right; }
#status.active { color: var(--active); }
#status.waiting { color: var(--hl-ink); background: var(--hl); padding: 0 8px; }
#status-sub { text-align: right; color: var(--muted); font-size: 13px; }
#meter-wrap { align-self: center; max-width: 420px; }
#meter { height: 8px; background: var(--rule); position: relative; }
#meter-fill { height: 100%; width: 0; background: var(--meter); }
#meter-thresh { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--bad); }
#meter-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

.cols { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 40px; }

dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

.slip { background: var(--hl); color: var(--hl-ink); padding: 14px 16px; border-left: 4px solid var(--hl-ink); margin-bottom: 12px; }
.slip p { margin: 0 0 10px; font-size: 18px; font-weight: 600; }

form.cmd { display: flex; gap: 8px; flex-wrap: wrap; }
form.cmd input[type=text] { flex: 1 1 280px; font: inherit; padding: 8px 10px; border: 1px solid var(--rule-strong);
  background: var(--bg); color: var(--ink); border-radius: 3px; }
button { font: inherit; font-weight: 600; padding: 8px 14px; border: 1px solid var(--btn); background: var(--btn);
  color: var(--btn-ink); border-radius: 3px; cursor: pointer; }
button.plain { background: transparent; color: var(--ink); }
button:disabled { opacity: .4; cursor: default; }
#cmd-reply { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 13px; border-bottom: 1px solid var(--rule-strong); padding: 4px 8px 4px 0; }
td { border-bottom: 1px solid var(--rule); padding: 7px 8px 7px 0; vertical-align: top; }
tr.turn { cursor: pointer; }
tr.turn:hover td { background: var(--row); }
tr.open td { background: var(--row); }
tr.detail td { background: var(--row); padding: 4px 12px 16px; }
td.when { white-space: nowrap; width: 1%; }
#procs td.num { white-space: nowrap; }
td.req { width: 34%; }
.src { font-size: 12px; color: var(--muted); display: block; }

ol.steps { margin: 6px 0 0; padding-left: 22px; }
ol.steps li { margin-bottom: 6px; }
ol.steps .res { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.shots { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.shots figure { margin: 0; }
.shots img { height: 110px; border: 1px solid var(--rule); display: block; }
.shots figcaption { font-size: 12px; color: var(--muted); max-width: 220px; }
#now-shot img { max-width: 100%; max-height: 260px; border: 1px solid var(--rule); display: block; margin-top: 10px; }

ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li { border-bottom: 1px solid var(--rule); padding: 6px 0; font-size: 14px; }
.empty { color: var(--muted); margin: 4px 0; }
#notes h3 { font-size: 15px; margin: 14px 0 4px; }
#notes p { margin: 2px 0; }
#notes ul { margin: 2px 0; padding-left: 20px; }
#notes li { margin-bottom: 2px; }
#conn { font-size: 13px; }
#more { margin-top: 10px; }

@media (max-width: 900px) {
  body { padding: 16px 16px 40px; }
  header { grid-template-columns: 1fr auto; }
  #meter-wrap { grid-column: 1 / -1; max-width: none; }
  .cols { grid-template-columns: 1fr; }
  td.req { width: auto; }
  .hide-narrow { display: none; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Jarvis</h1>
    <div id="conn" class="muted">Connecting...</div>
  </div>
  <div id="meter-wrap">
    <div id="meter" title="Microphone level"><div id="meter-fill"></div><div id="meter-thresh"></div></div>
    <div id="meter-label">Microphone</div>
  </div>
  <div>
    <div id="status">...</div>
    <div id="status-sub"></div>
  </div>
</header>

<div class="cols">
<main>
  <section>
    <h2>Now</h2>
    <div id="now"></div>
  </section>

  <section>
    <h2>Send a command</h2>
    <form class="cmd" id="cmd-form" autocomplete="off">
      <input type="text" id="cmd-text" placeholder="Type what you'd say, e.g. what's playing?" aria-label="Command">
      <button type="submit">Send</button>
      <button type="button" class="plain" data-cmd="listen">Listen</button>
      <button type="button" class="plain" data-cmd="stop">Stop</button>
      <button type="button" class="plain" data-cmd="new" title="Update his notes, then start a clean conversation">New session</button>
    </form>
    <div id="cmd-reply"></div>
  </section>

  <section>
    <h2>Waiting on</h2>
    <div id="waiting"></div>
  </section>

  <section>
    <h2>His notes</h2>
    <p class="muted" id="notes-meta"></p>
    <div id="notes"></div>
  </section>

  <section>
    <h2>History</h2>
    <table>
      <thead><tr><th>When</th><th>You asked</th><th>He said</th><th class="hide-narrow">Steps</th><th class="hide-narrow">Took</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
    <button type="button" class="plain" id="more" hidden>Show older</button>
  </section>
</main>

<aside>
  <section>
    <h2>Today</h2>
    <dl class="facts" id="today"></dl>
  </section>
  <section>
    <h2>Session</h2>
    <dl class="facts" id="session"></dl>
  </section>
  <section>
    <h2>Hearing</h2>
    <dl class="facts" id="ears"></dl>
    <ul class="plain" id="hearing" style="margin-top:10px"></ul>
  </section>
  <section>
    <h2>Processes</h2>
    <table><thead><tr><th>What</th><th class="num">CPU</th><th class="num">Memory</th><th>Running</th></tr></thead>
    <tbody id="procs"></tbody></table>
  </section>
  <section>
    <h2>Problems</h2>
    <ul class="plain" id="problems"></ul>
  </section>
</aside>
</div>

<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
let snap = null, history = [], procs = [], meter = {level: 0, wake: 0, activity: "idle"};
let openTurns = new Set(), historyLimit = 40, dirty = false, connected = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(s / 3600) + "h " + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
}
function ago(ts) { return dur(Date.now() / 1000 - ts) + " ago"; }
const isToday = ts => new Date(ts * 1000).toDateString() === new Date().toDateString();

const TOOL_NAMES = {
  screenshot: "Screenshot", click_at: "Click", move_mouse: "Move mouse", scroll: "Scroll", type_text: "Type",
  press_keys: "Press keys", open_app: "Open app", list_apps: "List apps", open_path: "Open", media: "Media",
  volume: "Volume", list_windows: "List windows", focus_window: "Focus window", notify: "Notification",
  Bash: "Command", Read: "Read file", Write: "Write file", Edit: "Edit file", Glob: "Find files", Grep: "Search files",
  WebSearch: "Web search", WebFetch: "Fetch web page", ToolSearch: "Load tools", Agent: "Sub-agent", Task: "Sub-agent",
  TodoWrite: "Plan", Skill: "Skill", navigate: "Chrome: go to page", computer: "Chrome: click/type",
  read_page: "Chrome: read page", get_page_text: "Chrome: page text", find: "Chrome: find", form_input: "Chrome: fill form",
  tabs_create_mcp: "Chrome: new tab", tabs_context_mcp: "Chrome: tabs", javascript_tool: "Chrome: run script",
};
function toolName(name) {
  const short = name.split("__").pop();
  if (TOOL_NAMES[short]) return TOOL_NAMES[short];
  const server = name.startsWith("mcp__") ? name.split("__")[1].replace(/^claude_ai_/, "").replace(/_/g, " ") + ": " : "";
  return server + short.replace(/[_-]+/g, " ");
}
function toolDetail(ev) {
  let inp = {};
  try { inp = JSON.parse(ev.input); } catch (e) { return ev.input; }
  const short = ev.name.split("__").pop();
  if (ev.name === "Bash") return inp.description ? inp.description : inp.command;
  if (short === "click_at") return `at ${inp.x},${inp.y}${inp.clicks > 1 ? " (double)" : ""}${inp.button && inp.button !== "left" ? " " + inp.button : ""}`;
  if (short === "screenshot") return inp.target;
  if (short === "type_text") return `"${inp.text}"`;
  if (short === "press_keys") return inp.keys;
  if (short === "ToolSearch") return "";
  for (const k of ["query", "name", "url", "file_path", "pattern", "description", "prompt", "text", "keys", "action", "target"])
    if (inp[k]) return String(inp[k]).slice(0, 200);
  return ev.input.slice(0, 160);
}

// ---------- turns from the event log ----------
function buildTurns() {
  const turns = []; let cur = null; const byTool = {};
  for (const ev of history) {
    if (ev.kind === "session_reset") {
      turns.push({reset: ev, start: ev});
      continue;
    }
    if (ev.kind === "turn_start") {
      cur = {start: ev, text: ev.text, source: ev.source, said: [], steps: [], shots: [], asks: [], end: null, first: null};
      turns.push(cur);
    } else if (!cur) {
      continue;
    } else if (ev.kind === "say") {
      cur.said.push(ev.text);
    } else if (ev.kind === "first_speech") {
      cur.first = ev.after_s;
    } else if (ev.kind === "tool_use") {
      const step = {ev, result: null};
      cur.steps.push(step); byTool[ev.tool_id] = step;
    } else if (ev.kind === "tool_result") {
      if (byTool[ev.tool_id]) byTool[ev.tool_id].result = ev;
    } else if (ev.kind === "screenshot") {
      cur.shots.push(ev);
    } else if (ev.kind === "confirm_answer" || (ev.kind === "gate" && ev.verdict === "deny")) {
      cur.asks.push(ev);
    } else if (ev.kind === "turn_end") {
      cur.end = ev; cur = null;
    }
  }
  return turns;
}

// ---------- rendering ----------
function renderStatus() {
  const a = meter.activity || (snap && snap.activity) || "idle";
  const words = {idle: "Idle", listening: "Listening", thinking: "Thinking", speaking: "Speaking", waiting: "Waiting for your yes or no", ready: "Update ready (waiting for a quiet moment on your call)"};
  const el = $("status");
  el.textContent = connected ? (words[a] || a) : "Not running";
  el.className = a === "waiting" ? "waiting" : (a === "idle" || !connected ? "" : "active");
  if (snap) $("status-sub").textContent = `Up for ${dur(Date.now() / 1000 - snap.started)}`;
  $("meter-fill").style.width = Math.round((meter.level || 0) * 100) + "%";
  const th = snap ? snap.config.wake_threshold : 0.5;
  $("meter-thresh").style.left = "calc(" + (th * 100) + "% - 1px)";
  $("meter-label").textContent = `Microphone level. Wake word score ${Number(meter.wake || 0).toFixed(2)} (wakes at ${th})`;
}

function renderNow(turns) {
  const el = $("now");
  const real = turns.filter(t => !t.reset);
  const last = real[real.length - 1];
  const active = last && !last.end ? last : null;
  let html = "";
  if (snap && snap.question) {
    html += `<div class="slip"><p>${esc(snap.question)}</p>
      <button type="button" data-cmd="yes">Yes</button> <button type="button" class="plain" data-cmd="no">No</button></div>`;
  }
  if (active) {
    const step = active.steps[active.steps.length - 1];
    const lastShot = active.shots[active.shots.length - 1];
    html += `<dl class="facts">
      <dt>Request</dt><dd>${esc(active.text) || "(he started this himself)"}</dd>
      <dt>From</dt><dd>${sourceWord(active.source)}</dd>
      <dt>Working for</dt><dd class="num" data-since="${active.start.ts}">${dur(Date.now() / 1000 - active.start.ts)}</dd>
      <dt>Current step</dt><dd>${step ? esc(toolName(step.ev.name)) + (toolDetail(step.ev) ? ": " + esc(toolDetail(step.ev)) : "") + (step.result ? "" : " (running)") : "Thinking"}</dd>
      <dt>Steps so far</dt><dd class="num">${active.steps.length}</dd>
      <dt>Said so far</dt><dd>${esc(active.said.join(" ")) || '<span class="muted">Nothing yet</span>'}</dd>
    </dl>`;
    if (lastShot) html += `<div id="now-shot"><img src="/shots/${esc(lastShot.file)}" alt="Latest screenshot: ${esc(lastShot.what)}"></div>`;
  } else if (!snap || !snap.question) {
    const done = [...real].reverse().find(t => t.end);
    html += `<p class="empty">Nothing right now.${done ? ` Last request finished ${ago(done.end.ts)}.` : ""}${snap && snap.queued ? ` ${snap.queued} queued.` : ""}</p>`;
  }
  el.innerHTML = html;
}

function sourceWord(s) { return {voice: "Voice", typed: "Typed", self: "Started by itself"}[s] || s; }

function renderWaiting() {
  const rows = [];
  const now = Date.now() / 1000;
  for (const t of (snap ? snap.tasks : [])) {
    rows.push(`<tr><td>${esc(t.description)}</td><td>${esc({local_agent: "Sub-agent", local_bash: "Background command", remote_agent: "Remote agent"}[t.type] || t.type || "Background task")}</td>
      <td class="num">${clock(t.started)}</td><td class="num">${dur(now - t.started)} so far</td>
      <td>${t.last_tool ? "Last step: " + esc(toolName(t.last_tool)) : ""}</td></tr>`);
  }
  const taskCmds = (snap ? snap.tasks : []).map(t => t.description);
  for (const p of procs.filter(p => p.role === "job" && !(snap && snap.tasks.some(t => t.type === "local_bash")))) {
    const left = p.ends ? `${dur(p.ends - now)} left` : `${dur(now - p.started)} so far`;
    rows.push(`<tr><td><code>${esc(p.label)}</code></td><td>Background command</td>
      <td class="num">${clock(p.started)}</td><td class="num">${left}</td><td></td></tr>`);
  }
  if (snap && snap.queued) rows.push(`<tr><td colspan="5">${snap.queued} request(s) queued behind the current one</td></tr>`);
  $("waiting").innerHTML = rows.length
    ? `<table><thead><tr><th>What</th><th>Kind</th><th>Started</th><th>Time</th><th></th></tr></thead><tbody>${rows.join("")}</tbody></table>`
    : `<p class="empty">Nothing in the background.</p>`;
}

function renderHistory(turns) {
  const real = turns.filter(t => !t.reset), lastReal = real[real.length - 1];
  const done = turns.filter(t => t.reset || t.end || t !== lastReal).reverse();
  const shown = done.slice(0, historyLimit);
  $("more").hidden = done.length <= historyLimit;
  $("history").innerHTML = shown.map(t => {
    if (t.reset) return `<tr><td class="when num">${clock(t.reset.ts)}</td><td colspan="4" class="muted">New session started (${t.reset.reason === "idle" ? "after being idle" : "you asked"}). Notes updated first.</td></tr>`;
    const key = t.start.id, open = openTurns.has(key);
    const took = t.end ? dur(t.end.duration_s) : "stopped";
    const reply = t.said.join(" ");
    let row = `<tr class="turn${open ? " open" : ""}" data-turn="${key}">
      <td class="when num">${clock(t.start.ts)}${isToday(t.start.ts) ? "" : `<span class="src">${new Date(t.start.ts * 1000).toLocaleDateString()}</span>`}</td>
      <td class="req">${esc(t.text) || '<span class="muted">(started by itself)</span>'}<span class="src">${sourceWord(t.source)}</span></td>
      <td>${esc(reply.length > 220 && !open ? reply.slice(0, 220) + "..." : reply) || '<span class="muted">(nothing)</span>'}${t.end && t.end.error ? ' <span class="bad">Ended with an error</span>' : ""}</td>
      <td class="num hide-narrow">${t.steps.length}</td><td class="num hide-narrow">${took}</td></tr>`;
    if (open) row += `<tr class="detail"><td colspan="5">${turnDetail(t)}</td></tr>`;
    return row;
  }).join("") || `<tr><td colspan="5" class="empty">No requests yet. Say "Hey Jarvis".</td></tr>`;
}

function turnDetail(t) {
  let h = "<dl class='facts'>";
  if (t.first != null) h += `<dt>First word after</dt><dd class="num">${t.first}s</dd>`;
  if (t.end) h += `<dt>Tokens</dt><dd class="num">${(t.end.tokens_in || 0).toLocaleString()} in, ${(t.end.tokens_out || 0).toLocaleString()} out</dd>`;
  for (const a of t.asks) {
    if (a.kind === "confirm_answer") h += `<dt>Asked you</dt><dd>${esc(a.question)} You said "${esc(a.answer || "nothing")}": ${a.approved ? '<span class="good">went ahead</span>' : '<span class="bad">did not</span>'}</dd>`;
    else h += `<dt>Refused</dt><dd class="bad">${esc(toolName(a.tool))}: ${esc(a.reason)}</dd>`;
  }
  h += "</dl>";
  if (t.steps.length) {
    h += "<ol class='steps'>" + t.steps.map(s => {
      const r = s.result;
      const res = r ? (r.error ? `<span class="res bad">${esc(r.preview)}</span>` : (r.preview ? `<span class="res">${esc(r.preview)}</span>` : "")) : `<span class="res">No result recorded</span>`;
      return `<li>${s.ev.sub ? '<span class="muted">Sub-agent: </span>' : ""}<strong>${esc(toolName(s.ev.name))}</strong>${toolDetail(s.ev) ? " " + esc(toolDetail(s.ev)) : ""}${s.ev.background ? " (in background)" : ""}${res}</li>`;
    }).join("") + "</ol>";
  }
  if (t.shots.length) h += "<div class='shots'>" + t.shots.map(s =>
    `<figure><a href="/shots/${esc(s.file)}" target="_blank"><img loading="lazy" src="/shots/${esc(s.file)}" alt=""></a><figcaption>${clock(s.ts)}, ${esc(s.what)}</figcaption></figure>`).join("") + "</div>";
  return h;
}

function renderToday(turns) {
  const today = turns.filter(t => !t.reset && isToday(t.start.ts));
  const ended = today.filter(t => t.end);
  const firsts = today.filter(t => t.first != null).map(t => t.first);
  const avg = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length) : null;
  const evToday = history.filter(e => isToday(e.ts));
  const count = f => evToday.filter(f).length;
  const tokens = ended.reduce((n, t) => n + (t.end.tokens_out || 0), 0);
  const firstAvg = avg(firsts), turnAvg = avg(ended.map(t => t.end.duration_s));
  $("today").innerHTML = `
    <dt>Requests</dt><dd class="num">${today.length} (${today.filter(t => t.source === "voice").length} spoken, ${today.filter(t => t.source === "typed").length} typed, ${today.filter(t => t.source === "self").length} by himself)</dd>
    <dt>First word after</dt><dd class="num">${firstAvg != null ? firstAvg.toFixed(1) + "s on average" : "-"}</dd>
    <dt>Whole request</dt><dd class="num">${turnAvg != null ? dur(turnAvg) + " on average" : "-"}</dd>
    <dt>Steps taken</dt><dd class="num">${count(e => e.kind === "tool_use")}</dd>
    <dt>Screenshots</dt><dd class="num">${count(e => e.kind === "screenshot")}</dd>
    <dt>Asked you</dt><dd class="num">${count(e => e.kind === "confirm_answer")} (you said no ${count(e => e.kind === "confirm_answer" && !e.approved)})</dd>
    <dt>Refused by rules</dt><dd class="num">${count(e => e.kind === "gate" && e.verdict === "deny")}</dd>
    <dt>You cut him off</dt><dd class="num">${count(e => e.kind === "barge_in" || e.kind === "stopped_by_user")}</dd>
    <dt>Tokens written</dt><dd class="num">${tokens.toLocaleString()}</dd>`;
}

function renderSession() {
  if (!snap) return;
  const c = snap.context || {}, b = snap.brain || {}, cfg = snap.config, sess = snap.session || {};
  const mcp = (b.mcp || []).map(m => `${esc(m.name)}${m.status && m.status !== "connected" ? ` <span class="bad">(${esc(m.status)})</span>` : ""}`).join(", ");
  $("session").innerHTML = `
    <dt>Model</dt><dd>${esc(b.model || cfg.model)}, ${esc(cfg.effort)} effort</dd>
    <dt>Memory used</dt><dd class="num">${c.percentage != null ? `${Math.round(c.percentage)}% of context (${(c.totalTokens || 0).toLocaleString()} of ${(c.maxTokens || 0).toLocaleString()} tokens)` : "Shown after the first request"}</dd>
    <dt>Tools</dt><dd class="num">${b.tools != null ? `${b.tools}, of which ${b.chrome_tools} are Chrome` : "Shown after the first request"}</dd>
    <dt>Connectors</dt><dd>${mcp || "-"}</dd>
    <dt>This session</dt><dd class="num">${sess.resetting ? "Updating notes and starting fresh..." : `Started ${clock(sess.started)}, ${sess.turns} request${sess.turns === 1 ? "" : "s"}`}</dd>
    <dt>Fresh session</dt><dd>${sess.turns ? `After ${sess.reset_after_min} min with nothing going on (${idleLeft(sess)})` : "Already fresh"}</dd>
    <dt>Jarvis running since</dt><dd class="num">${clock(snap.started)}</dd>`;
}

function idleLeft(sess) {
  const left = sess.last_activity + sess.reset_after_min * 60 - Date.now() / 1000;
  return left > 0 ? `in ${dur(left)} if you stay quiet` : "at the next quiet moment";
}

function renderNotes() {
  if (!snap) return;
  const n = snap.notes || {};
  const updating = history.length && history[history.length - 1].kind === "notes" && history[history.length - 1].status === "updating";
  $("notes-meta").textContent = updating ? "Updating now..." : n.updated ? `Saved in ~/jarvis/JARVIS.md, last written ${ago(n.updated)}. Each new session starts by reading this.`
    : "Empty until his first session ends. Each new session starts by reading this.";
  const lines = (n.text || "").split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (/^# /.test(line) || /^Last updated/.test(line)) continue;
    const isItem = /^\s*[-*] /.test(line);
    if (inList && !isItem) { html += "</ul>"; inList = false; }
    if (/^## /.test(line)) html += `<h3>${esc(line.slice(3))}</h3>`;
    else if (isItem) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${esc(line.replace(/^\s*[-*] /, ""))}</li>`; }
    else if (line.trim()) html += `<p>${esc(line)}</p>`;
  }
  if (inList) html += "</ul>";
  $("notes").innerHTML = html || "";
}

function renderEars() {
  if (!snap) return;
  const cfg = snap.config;
  $("ears").innerHTML = `<dt>Microphone</dt><dd>${esc(cfg.mic)}</dd><dt>Speech to text</dt><dd>Whisper ${esc(cfg.whisper)}</dd><dt>Voice</dt><dd>${esc(cfg.voice)}</dd>`;
  const heard = history.filter(e => e.kind === "wake" || e.kind === "heard").slice(-10).reverse();
  $("hearing").innerHTML = heard.map(e => e.kind === "wake"
    ? `<li><span class="num muted">${clock(e.ts)}</span> Woke (${esc(e.how)}${e.score ? ", score " + e.score : ""})</li>`
    : `<li><span class="num muted">${clock(e.ts)}</span> ${e.text ? `Heard "${esc(e.text)}"${e.confirm ? " as a yes/no" : ""}` : '<span class="muted">Heard nothing</span>'}</li>`
  ).join("") || `<li class="muted">Nothing heard yet.</li>`;
}

function renderProcs() {
  const now = Date.now() / 1000;
  $("procs").innerHTML = procs.map(p => `<tr><td>${p.role === "job" ? `<code>${esc(p.label)}</code>` : esc(p.label)}</td>
    <td class="num">${p.cpu}%</td><td class="num">${p.mem_mb} MB</td><td class="num">${dur(now - p.started)}</td></tr>`).join("")
    || `<tr><td colspan="4" class="empty">-</td></tr>`;
}

function renderProblems() {
  const bad = history.filter(e => e.kind === "error" || (e.kind === "brain" && e.status === "crashed")
    || (e.kind === "tool_result" && e.error)).slice(-8).reverse();
  $("problems").innerHTML = bad.map(e => `<li><span class="num muted">${clock(e.ts)}</span> ${
    e.kind === "tool_result" ? "A step failed: " + esc(e.preview.slice(0, 200)) : esc(e.where || "Brain") + ": " + esc(e.error)}</li>`).join("")
    || `<li class="muted">None.</li>`;
}

function render() {
  dirty = false;
  const turns = buildTurns();
  renderStatus(); renderNow(turns); renderWaiting(); renderHistory(turns);
  renderToday(turns); renderSession(); renderNotes(); renderEars(); renderProcs(); renderProblems();
}
function schedule() { if (!dirty) { dirty = true; requestAnimationFrame(render); } }

// ---------- data ----------
async function loadSnapshot() {
  const r = await fetch("/api/snapshot", {cache: "no-store"});
  snap = await r.json();
  history = snap.history; procs = snap.procs; meter.activity = snap.activity;
  schedule();
}

const SNAPSHOT_KINDS = new Set(["state", "turn_start", "turn_end", "confirm_ask", "confirm_answer", "task_started",
  "task_progress", "task_done", "brain_info", "context", "brain", "started", "notes", "session_reset"]);

function connect() {
  const es = new EventSource("/api/events");
  es.onopen = () => { connected = true; $("conn").textContent = "Live"; loadSnapshot(); };
  es.onerror = () => { connected = false; $("conn").textContent = "Jarvis isn't answering. Retrying..."; schedule(); };
  es.onmessage = m => {
    const ev = JSON.parse(m.data);
    if (ev.kind === "meter") { meter = ev; renderStatus(); return; }
    if (ev.kind === "procs") { procs = ev.procs; renderProcs(); renderWaiting(); return; }
    history.push(ev);
    if (history.length > 4000) history = history.slice(-3000);
    if (SNAPSHOT_KINDS.has(ev.kind)) loadSnapshot(); else schedule();
  };
}

async function send(cmd, text) {
  $("cmd-reply").textContent = "";
  try {
    const r = await fetch("/api/cmd", {method: "POST", headers: {"Content-Type": "application/json", "X-Jarvis-Token": TOKEN},
      body: JSON.stringify({cmd, text})});
    // Jarvis restarted since this tab loaded, so its token is stale: reload to pick up the new one.
    if (r.status === 403) { $("cmd-reply").textContent = "Jarvis restarted, reloading..."; return setTimeout(() => location.reload(), 800); }
    const j = await r.json();
    $("cmd-reply").textContent = j.reply === "ok" ? "" : j.reply;
  } catch (e) { $("cmd-reply").textContent = "Couldn't reach Jarvis."; }
}

$("cmd-form").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("cmd-text").value.trim();
  if (t) { send("say", t); $("cmd-text").value = ""; }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-cmd]");
  if (b) { send(b.dataset.cmd); return; }
  const row = e.target.closest("tr.turn");
  if (row) {
    const k = Number(row.dataset.turn);
    openTurns.has(k) ? openTurns.delete(k) : openTurns.add(k);
    schedule();
  }
});
$("more").addEventListener("click", () => { historyLimit += 40; schedule(); });
setInterval(() => { if (snap) { renderStatus(); renderNow(buildTurns()); renderWaiting(); } }, 1000);
connect();
</script>
</body>
</html>
